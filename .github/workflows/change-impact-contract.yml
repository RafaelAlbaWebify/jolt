name: Change impact contract
on:
  pull_request:
  push:
    branches:
      - 'quality/change-impact-gate-20261024'
jobs:
  analyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile analyzer
        run: python -m py_compile tools/change_impact.py tools/test_change_impact.py tools/preflight-indeed-recovery.py tools/test_preflight_indeed_recovery.py
      - name: Install pytest
        run: python -m pip install pytest
      - name: Unit regression
        run: python -m pytest tools/test_change_impact.py tools/test_preflight_indeed_recovery.py -q
      - name: Analyze actual branch changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            python tools/change_impact.py --base "$BASE_SHA" --output /tmp/jolt-impact.json
          else
            python tools/change_impact.py --changed backend/src/jolt/schemas.py --output /tmp/jolt-impact.json
          fi
      - name: Upload impact report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jolt-change-impact
          path: /tmp/jolt-impact.json
          if-no-files-found: warn
      - name: Smoke core schema impact
        run: python tools/change_impact.py --changed backend/src/jolt/schemas.py --output /tmp/jolt-schema-impact.json
      - name: Enforce known capture contract consistency when configured
        run: |
          python - <<'PY'
          import json
          data=json.load(open('/tmp/jolt-impact.json'))
          risks=data.get('capture_contract_risks', [])
          mismatches=[r for r in risks if r['status']=='incompatible']
          if mismatches:
              print('Capture contract mismatches:', mismatches)
              raise SystemExit(1)
          print('Capture contract check: no proven incompatibilities; unknowns remain visible')
          PY
      - name: Assert nonempty impact
        run: |
          python - <<'PY'
          import json
          data=json.load(open('/tmp/jolt-schema-impact.json'))
          assert data['inventory_files'] >= 100
          assert data['resolved_edges'] >= 100
          assert data['affected_dependents']
          assert data['test_candidates']
          print('Impact graph smoke PASS')
          PY
