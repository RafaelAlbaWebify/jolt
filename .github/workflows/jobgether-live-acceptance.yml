name: Jobgether official detail live acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/jobgether-live-acceptance.yml

jobs:
  official-detail-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.14"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch one known official Jobgether offer (read-only)
        working-directory: backend
        run: |
          PYTHONPATH=src python -m jolt.jobgether_detail_probe --url "https://jobgether.com/offer/6ac5d9628a27695aea363d32-2nd-and-3rd-level-it-support-technician"
