name: Temporary Preference Market Fix

on:
  push:
    branches:
      - agent/preference-aware-market-intelligence
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-preference-market-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/preference-aware-market-intelligence
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch preference-aware evaluation and market analytics
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('backend/src/jolt/workflow.py')
          text = workflow.read_text(encoding='utf-8')
          text = text.replace('from jolt.schemas import (', 'from jolt.job_search_preferences import load_job_search_preferences\nfrom jolt.schemas import (', 1)
          old = '''def evaluate_text(text: str) -> tuple[str, str, int, list[str]]:
    lowered = text.lower()
    blockers = [
        phrase for phrase in PROFILE_CONFIGURATION["hard_reject_phrases"] if phrase in lowered
    ]
    matches = [term for term in PROFILE_CONFIGURATION["positive_terms"] if term in lowered]
    reasons: list[str] = []
    if blockers:
        reasons.append(f"Verified blocking phrase(s): {', '.join(blockers)}.")
        return "reject", "high", 0, reasons
    if matches:
        reasons.append(f"Relevant signal(s): {', '.join(matches)}.")
    score = min(100, 35 + len(matches) * 12)
    if len(matches) >= 3:
        return "pursue", "medium", score, reasons
    reasons.append("No verified hard blocker; more evidence or human review may be needed.")
    return "consider", "medium" if matches else "low", score, reasons
'''
          new = '''def _explicit_language_blockers(text: str, allowed_languages: list[str]) -> list[str]:
    lowered = text.casefold()
    allowed = {item.casefold() for item in allowed_languages}
    detected: list[str] = []
    language_terms = {
        "french": ("french speaking", "french-speaking", "must speak french", "french required", "mandatory french"),
        "german": ("german speaking", "german-speaking", "must speak german", "german required", "mandatory german"),
        "italian": ("italian speaking", "italian-speaking", "must speak italian", "italian required", "mandatory italian"),
        "dutch": ("dutch speaking", "dutch-speaking", "must speak dutch", "dutch required", "mandatory dutch"),
        "portuguese": ("portuguese speaking", "portuguese-speaking", "must speak portuguese", "portuguese required", "mandatory portuguese"),
    }
    for language, phrases in language_terms.items():
        if language not in allowed and any(phrase in lowered for phrase in phrases):
            detected.append(f"required language outside current preferences: {language}")
    return detected


def _explicit_shift_blockers(text: str, excluded_shifts: list[str]) -> list[str]:
    lowered = text.casefold()
    shift_terms = {
        "night": ("night shift", "night shifts", "overnight shift"),
        "rotating": ("rotating shift", "rotating shifts", "rotational shift"),
        "weekend": ("weekend coverage", "weekend shift", "weekend shifts"),
        "evening": ("evening shift", "evening shifts"),
    }
    detected: list[str] = []
    for shift in excluded_shifts:
        phrases = shift_terms.get(shift, ())
        if phrases and any(phrase in lowered for phrase in phrases):
            detected.append(f"shift excluded by current preferences: {shift}")
    return detected


def evaluate_text(text: str) -> tuple[str, str, int, list[str]]:
    preferences = load_job_search_preferences()
    lowered = text.casefold()
    configured_exclusions = [phrase.casefold() for phrase in preferences.excluded_keywords if phrase.strip()]
    blockers = [phrase for phrase in configured_exclusions if phrase in lowered]
    blockers.extend(_explicit_language_blockers(text, preferences.languages))
    blockers.extend(_explicit_shift_blockers(text, list(preferences.excluded_shifts)))
    preferred_terms = list(dict.fromkeys([
        *PROFILE_CONFIGURATION["positive_terms"],
        *(term.casefold() for term in preferences.preferred_keywords if term.strip()),
        *(term.casefold() for term in preferences.target_titles if term.strip()),
    ]))
    matches = [term for term in preferred_terms if term in lowered]
    reasons: list[str] = ["Applied the current saved JOLT job-search preferences."]
    if blockers:
        reasons.append(f"Verified preference blocker(s): {', '.join(blockers)}.")
        return "reject", "high", 0, reasons
    if matches:
        reasons.append(f"Relevant preference signal(s): {', '.join(matches)}.")
    score = min(100, 35 + len(matches) * 12)
    if len(matches) >= 3:
        return "pursue", "medium", score, reasons
    reasons.append("No verified preference blocker; more evidence or human review may be needed.")
    return "consider", "medium" if matches else "low", score, reasons
'''
          if old not in text:
              raise SystemExit('workflow evaluate_text block not found')
          workflow.write_text(text.replace(old, new, 1), encoding='utf-8')

          market = Path('backend/src/jolt/market_intelligence.py')
          text = market.read_text(encoding='utf-8')
          text = text.replace('def _filter_by_source_scope(\n', '''def _is_synthetic_audit_posting(posting: Posting) -> bool:\n    title = posting.title.casefold()\n    company = posting.company.casefold()\n    return (\n        title.startswith("jolt daily workflow audit")\n        or title.startswith("jolt stage reversal audit")\n        or company in {"audit systems", "audit systems ltd"}\n    )\n\n\ndef _filter_by_source_scope(\n''', 1)
          old_query = '''    evaluations = list(
        session.scalars(
            select(Evaluation)
            .where(Evaluation.engine_version == ENGINE_VERSION)
            .order_by(Evaluation.created_at.desc())
        ).all()
    )
    latest_evaluations: dict[str, Evaluation] = {}
    for evaluation in evaluations:
        latest_evaluations.setdefault(evaluation.posting_id, evaluation)
'''
          new_query = '''    evaluations = list(
        session.scalars(select(Evaluation).order_by(Evaluation.created_at.desc())).all()
    )
    latest_evaluations: dict[str, Evaluation] = {}
    current_engine_evaluations: dict[str, Evaluation] = {}
    for evaluation in evaluations:
        latest_evaluations.setdefault(evaluation.posting_id, evaluation)
        if evaluation.engine_version == ENGINE_VERSION:
            current_engine_evaluations.setdefault(evaluation.posting_id, evaluation)
    effective_evaluations = {
        posting.id: current_engine_evaluations.get(posting.id)
        or latest_evaluations.get(posting.id)
        for posting in postings
    }
    effective_evaluations = {
        posting_id: evaluation
        for posting_id, evaluation in effective_evaluations.items()
        if evaluation is not None
    }
'''
          if old_query not in text:
              raise SystemExit('market evaluation query block not found')
          text = text.replace(old_query, new_query, 1)
          text = text.replace('    source_filtered = _filter_by_source_scope(active_postings, capture_statuses, source_scope)\n', '    production_postings = [posting for posting in active_postings if not _is_synthetic_audit_posting(posting)]\n    source_filtered = _filter_by_source_scope(production_postings, capture_statuses, source_scope)\n', 1)
          text = text.replace('        "target": _scope_data(target_postings, latest_evaluations),\n        "all": _scope_data(postings, latest_evaluations),\n', '        "target": _scope_data(target_postings, effective_evaluations),\n        "all": _scope_data(postings, effective_evaluations),\n        "evaluation_coverage": {\n            "posting_count": len(postings),\n            "evaluated_count": len(effective_evaluations),\n            "missing_count": len(postings) - len(effective_evaluations),\n            "current_engine_count": sum(1 for posting in postings if posting.id in current_engine_evaluations),\n            "fallback_engine_count": sum(1 for posting in postings if posting.id in effective_evaluations and posting.id not in current_engine_evaluations),\n            "current_engine": ENGINE_VERSION,\n        },\n        "excluded_synthetic_count": len(active_postings) - len(production_postings),\n', 1)
          market.write_text(text, encoding='utf-8')

          Path('backend/tests/test_preference_aware_market_intelligence.py').write_text('''from pathlib import Path\n\nfrom fastapi.testclient import TestClient\n\nfrom jolt.main import create_app\n\n\ndef _client(tmp_path: Path) -> TestClient:\n    return TestClient(create_app(f"sqlite:///{(tmp_path / 'jolt.db').as_posix()}"))\n\n\ndef test_market_uses_latest_fallback_evaluation_and_excludes_audit_fixture(tmp_path: Path) -> None:\n    client = _client(tmp_path)\n    client.post("/api/intake/manual", json={"source_type": "manual", "source_url": "https://example.test/real-role", "raw_text": "Technical Support Engineer\\nReal Company\\nLocation: Remote Spain\\nSQL API incident support"})\n    client.post("/api/intake/manual", json={"source_type": "manual", "source_url": "https://example.test/audit-role", "raw_text": "JOLT Daily Workflow Audit 123\\nAudit Systems\\nLocation: Remote Spain\\nSQL API support"})\n    payload = client.get("/api/market-intelligence?timeframe=all&source_scope=manual_intake").json()\n    assert payload["total_unique_roles"] == 1\n    assert payload["excluded_synthetic_count"] == 1\n    assert payload["evaluation_coverage"]["evaluated_count"] == 1\n    assert payload["evaluation_coverage"]["fallback_engine_count"] == 1\n    assert sum(item["count"] for item in payload["all"]["fit_distribution"]) == 1\n\n\ndef test_shift_is_blocked_only_when_saved_preferences_exclude_it(monkeypatch) -> None:\n    from jolt import workflow\n    from jolt.job_search_preferences import JobSearchPreferences\n    monkeypatch.setattr(workflow, "load_job_search_preferences", lambda: JobSearchPreferences(excluded_shifts=[]))\n    recommendation, _, score, reasons = workflow.evaluate_text("Technical Support Engineer night shifts SQL API incident")\n    assert recommendation == "pursue"\n    assert score > 0\n    assert not any("shift excluded" in reason for reason in reasons)\n    monkeypatch.setattr(workflow, "load_job_search_preferences", lambda: JobSearchPreferences(excluded_shifts=["night"]))\n    recommendation, _, score, reasons = workflow.evaluate_text("Technical Support Engineer night shifts SQL API incident")\n    assert recommendation == "reject"\n    assert score == 0\n    assert any("shift excluded" in reason for reason in reasons)\n''', encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit implementation
        run: |
          rm .github/workflows/temporary-preference-market-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend .github/workflows
          git commit -m 'Use saved preferences and restore market evaluation coverage'
          git push origin HEAD:agent/preference-aware-market-intelligence
