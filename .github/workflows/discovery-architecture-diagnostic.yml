name: Discovery architecture diagnostic

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/src/jolt/**'
      - 'frontend/src/**'
      - 'tools/diagnose_discovery_pipeline.py'
      - 'backend/tests/test_discovery_diagnostics.py'
      - '.github/workflows/discovery-architecture-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate read-only architecture report
        run: python tools/diagnose_discovery_pipeline.py --output discovery-architecture.json
      - name: Run isolated diagnostic contract tests
        run: python -m unittest discover -s tools -p 'test_discovery_architecture*.py'
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-architecture-report
          path: discovery-architecture.json
          if-no-files-found: warn
