name: Temporary hardline Phase 2 v2
on:
  push:
    branches: [fix/hardline-gate-priority-20260902]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hardline-gate-priority-20260902
      - name: Apply Phase 2 patch
        run: python tools/temp_hardline_phase2_patch.py
      - name: Focused validation
        run: |
          python -m pip install ruff pytest pytest-cov >/dev/null
          ruff check --fix backend/src/jolt/database.py backend/src/jolt/ai_review_pack.py backend/src/jolt/hardline_evidence.py backend/src/jolt/ai_review_import.py backend/tests/test_ai_review_pack.py backend/tests/test_hardline_ai_review_gate.py backend/migrations/versions/20260902_0022_ai_review_hardlines.py
          ruff format backend/src/jolt/database.py backend/src/jolt/ai_review_pack.py backend/src/jolt/hardline_evidence.py backend/src/jolt/ai_review_import.py backend/tests/test_ai_review_pack.py backend/tests/test_hardline_ai_review_gate.py backend/migrations/versions/20260902_0022_ai_review_hardlines.py
          ruff check backend/src/jolt/database.py backend/src/jolt/ai_review_pack.py backend/src/jolt/hardline_evidence.py backend/src/jolt/ai_review_import.py backend/tests/test_ai_review_pack.py backend/tests/test_hardline_ai_review_gate.py backend/migrations/versions/20260902_0022_ai_review_hardlines.py
          cd backend
          python -m pip install -e . >/dev/null
          python -m pytest -q tests/test_hardline_ai_review_gate.py tests/test_ai_review_pack.py tests/test_ai_review_import.py
      - name: Commit intended production and test files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/jolt/database.py backend/src/jolt/ai_review_pack.py backend/src/jolt/hardline_evidence.py backend/src/jolt/ai_review_import.py backend/tests/test_ai_review_pack.py backend/tests/test_hardline_ai_review_gate.py backend/migrations/versions/20260902_0022_ai_review_hardlines.py
          git commit -m "Enforce two-stage hardline review gate"
          git push origin HEAD:fix/hardline-gate-priority-20260902
