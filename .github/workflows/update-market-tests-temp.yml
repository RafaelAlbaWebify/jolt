name: Temporary market test alignment

on:
  push:
    branches:
      - feature/market-intelligence-authority-cleanup-20260902

permissions:
  contents: write

jobs:
  align-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/market-intelligence-authority-cleanup-20260902
      - name: Align legacy retention tests with AI authority boundary
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/tests/test_retention_ownership.py')
          text = path.read_text(encoding='utf-8')

          old = '''        assert len(postings) == 2\n        assert len(evaluations) == 2\n'''
          new = '''        assert len(postings) == 2\n        assert evaluations == {}\n'''
          if old not in text:
              raise SystemExit('Repeated-capture assertion block not found')
          text = text.replace(old, new, 1)

          old = '''def test_observation_extraction_prefers_current_engine_evaluation(\n    tmp_path,\n) -> None:\n'''
          new = '''def test_observation_extraction_ignores_local_engine_evaluations(\n    tmp_path,\n) -> None:\n'''
          if old not in text:
              raise SystemExit('Legacy engine test header not found')
          text = text.replace(old, new, 1)

          old = '''        assert rebuilt is not None\n        assert rebuilt.engine_version == ENGINE_VERSION\n        assert rebuilt.recommendation == "pursue"\n        assert rebuilt.confidence == "medium"\n        assert rebuilt.ranking_score == 73\n        assert rebuilt.reasons_json == '["current-engine-test"]'\n'''
          new = '''        assert rebuilt is not None\n        assert rebuilt.engine_version == ""\n        assert rebuilt.recommendation == ""\n        assert rebuilt.confidence == ""\n        assert rebuilt.ranking_score is None\n        assert rebuilt.reasons_json == "[]"\n'''
          if old not in text:
              raise SystemExit('Legacy engine expectation block not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit aligned test only when changed
        run: |
          if git diff --quiet -- backend/tests/test_retention_ownership.py; then
            echo "Tests already aligned."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/tests/test_retention_ownership.py
          git commit -m "Align market retention tests with AI authority"
          git push origin HEAD:feature/market-intelligence-authority-cleanup-20260902
