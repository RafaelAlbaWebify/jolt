name: PR 393 final autoformat

on:
  push:
    branches:
      - fix/linkedin-profile-scroll-owner-20260906

permissions:
  contents: write

jobs:
  autoformat:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/linkedin-profile-scroll-owner-20260906
      - uses: astral-sh/setup-uv@v5
        with:
          version: '0.5.14'
      - name: Install Python
        run: uv python install 3.12
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --all-groups
      - name: Format LinkedIn capture
        working-directory: backend
        run: uv run ruff format src/jolt/linkedin_playwright_capture.py
      - name: Commit formatter result
        run: |
          if git diff --quiet -- backend/src/jolt/linkedin_playwright_capture.py; then
            echo "No formatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/jolt/linkedin_playwright_capture.py
          git commit -m "Format LinkedIn traversal typing fix"
          git push origin HEAD:fix/linkedin-profile-scroll-owner-20260906
