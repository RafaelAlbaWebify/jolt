name: Playwright acceptance

on:
  pull_request:
  workflow_dispatch:

jobs:
  sidebar-kanban:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.14"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: |
          uv python install 3.12
          uv sync --all-groups
          uv run playwright install --with-deps chromium
      - name: Prepare database
        working-directory: backend
        run: |
          mkdir -p data
          uv run alembic upgrade head
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-fund
      - name: Start JOLT services
        run: |
          mkdir -p artifacts/playwright-acceptance
          (cd backend && nohup uv run uvicorn jolt.main:app --host 127.0.0.1 --port 8000 > ../artifacts/playwright-acceptance/backend.log 2>&1 &)
          (cd frontend && nohup npm run dev -- --host 127.0.0.1 > ../artifacts/playwright-acceptance/frontend.log 2>&1 &)
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8000/api/health >/dev/null && curl --silent --fail http://127.0.0.1:5173 >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "JOLT services did not become ready." >&2
          exit 1
      - name: Run Playwright acceptance
        working-directory: backend
        run: uv run python ../tools/jolt-sidebar-kanban-playwright-audit.py --output-dir ../artifacts/playwright-acceptance/evidence
      - name: Upload Playwright acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sidebar-kanban-playwright-acceptance
          path: artifacts/playwright-acceptance
