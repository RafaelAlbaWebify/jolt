name: Temporary Test Contracts PR215

on:
  push:
    branches:
      - agent/fix-capture-source-selection
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temporary-test-contracts-pr215-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-capture-source-selection
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch migration and failure test expectations
        run: |
          python - <<'PY'
          from pathlib import Path
          revision_files = [
              'backend/tests/test_posting_identity_constraint.py',
              'backend/tests/test_posting_identity_migration.py',
              'backend/tests/test_readiness_migration.py',
              'backend/tests/test_runtime_identity.py',
              'backend/tests/test_schema_authority.py',
          ]
          for name in revision_files:
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              text = text.replace('20260728_0017', '20260730_0018')
              path.write_text(text, encoding='utf-8')

          path = Path('backend/tests/test_professional_capture_artifact_staging.py')
          text = path.read_text(encoding='utf-8')
          old = '''    with (
        factory() as session,
        pytest.raises(OSError, match="fixture staged write failure"),
    ):
        start_professional_supervised_capture(session, run_id, capture_source=_fixture_page)

    with factory() as session:
'''
          new = '''    with factory() as session:
        failed = start_professional_supervised_capture(
            session, run_id, capture_source=_fixture_page
        )
        assert failed.status == "failed"
        assert failed.stop_reason == "capture_engine_failure"

    with factory() as session:
'''
          if old not in text:
              raise SystemExit('artifact staging failure block not found')
          text = text.replace(old, new, 1)
          text = text.replace('import pytest\n', '')
          path.write_text(text, encoding='utf-8')

          path = Path('backend/tests/test_professional_intelligence_supervised_capture.py')
          text = path.read_text(encoding='utf-8')
          old = '''    with (
        factory() as session,
        pytest.raises(OSError, match="fixture storage failure"),
    ):
        start_professional_supervised_capture(session, run_id, capture_source=_fixture_page)

    client = TestClient(create_app(database_url))
'''
          new = '''    with factory() as session:
        completed = start_professional_supervised_capture(
            session, run_id, capture_source=_fixture_page
        )
        assert completed.status == "failed"
        assert completed.stop_reason == "capture_engine_failure"

    client = TestClient(create_app(database_url))
'''
          if old not in text:
              raise SystemExit('supervised capture failure block not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit test contract updates
        run: |
          if git diff --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/tests
          git commit -m 'Update capture PR test contracts'
          git push origin HEAD:agent/fix-capture-source-selection
