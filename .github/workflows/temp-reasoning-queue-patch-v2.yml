name: Temporary reasoning queue patch v2

on:
  push:
    branches: [feature/reasoning-queue-hardening-20260902]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/reasoning-queue-hardening-20260902
      - name: Apply patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/src/jolt/ai_review_pack.py')
          s = p.read_text()
          s = s.replace('from jolt.database import CaptureItem, CapturePage, CaptureRun, Posting, SourceDocument', 'from jolt.database import AIReview, CaptureItem, CapturePage, CaptureRun, Posting, SourceDocument', 1)
          a = s.index('def _latest_capture(session: Session) -> CaptureRun:')
          b = s.index('\n\ndef _analysis_text', a)
          s = s[:a] + '''def _next_pending_capture(session: Session) -> CaptureRun:\n    captures = list(\n        session.scalars(\n            select(CaptureRun)\n            .where(CaptureRun.status != "archived")\n            .order_by(CaptureRun.started_at.asc(), CaptureRun.id.asc())\n        ).all()\n    )\n    for capture in captures:\n        verified_posting_ids = set(\n            session.scalars(\n                select(CaptureItem.posting_id).where(\n                    CaptureItem.capture_run_id == capture.id,\n                    CaptureItem.detail_status == "verified",\n                    CaptureItem.posting_id.is_not(None),\n                )\n            ).all()\n        )\n        if not verified_posting_ids:\n            continue\n        reviewed_posting_ids = set(\n            session.scalars(\n                select(AIReview.posting_id).where(\n                    AIReview.capture_run_id == capture.id,\n                    AIReview.review_source == "chatgpt_source_first",\n                )\n            ).all()\n        )\n        if verified_posting_ids - reviewed_posting_ids:\n            return capture\n    raise JoltNotFoundError("No capture run has verified jobs awaiting AI review.")\n''' + s[b:]
          s = s.replace('capture = _latest_capture(session)', 'capture = _next_pending_capture(session)', 1)
          old = '''    items = list(\n        session.scalars(\n            select(CaptureItem)\n            .where(CaptureItem.capture_run_id == capture.id)\n            .order_by(CaptureItem.id)\n        ).all()\n    )\n\n    posting_ids = {item.posting_id for item in items if item.posting_id is not None}\n'''
          new = '''    all_items = list(\n        session.scalars(\n            select(CaptureItem)\n            .where(CaptureItem.capture_run_id == capture.id)\n            .order_by(CaptureItem.id)\n        ).all()\n    )\n    reviewed_posting_ids = set(\n        session.scalars(\n            select(AIReview.posting_id).where(\n                AIReview.capture_run_id == capture.id,\n                AIReview.review_source == "chatgpt_source_first",\n            )\n        ).all()\n    )\n    items = [\n        item for item in all_items\n        if item.detail_status == "verified"\n        and item.posting_id is not None\n        and item.posting_id not in reviewed_posting_ids\n    ]\n\n    posting_ids = {item.posting_id for item in items if item.posting_id is not None}\n'''
          if old not in s: raise SystemExit('items anchor missing')
          s = s.replace(old, new, 1)
          s = s.replace('''        "item_count": len(items),\n        "verified_item_count": sum(item.detail_status == "verified" for item in items),\n''', '''        "item_count": len(all_items),\n        "verified_item_count": sum(item.detail_status == "verified" for item in all_items),\n        "pending_review_item_count": len(items),\n''', 1)
          s = s.replace('''        "verified_items": sum(item.detail_status == "verified" for item in items),\n''', '''        "verified_items": len(items),\n''', 1)
          p.write_text(s)

          t = Path('backend/tests/test_ai_review_pack.py')
          q = t.read_text()
          q = q.replace('from datetime import UTC, datetime', 'from datetime import UTC, datetime, timedelta', 1)
          q = q.replace('    CaptureItem,', '    AIReview,\n    CaptureItem,', 1)
          if 'test_ai_review_export_excludes_rejected_unverified_items' not in q:
              q += '''\n\ndef test_ai_review_export_excludes_rejected_unverified_items(tmp_path) -> None:\n    session, capture, posting, raw_text = _seed_ai_review_capture(tmp_path)\n    try:\n        session.add(CaptureItem(\n            id="item-rejected", capture_run_id=capture.id, source_job_id="bad-source",\n            source_url="https://www.linkedin.com/jobs/view/bad-source/", title="Broken", company="", location="",\n            detail_status="rejected_unverified", verification_reasons_json='["missing company"]',\n            source_document_id=None, posting_id=None,\n        ))\n        capture.observed_item_count = 2\n        session.commit()\n        document = json.loads(build_ai_review_json(session))\n        assert document["counts"]["capture_items"] == 1\n        assert document["counts"]["verified_items"] == 1\n        assert document["capture"]["item_count"] == 2\n        assert document["capture"]["verified_item_count"] == 1\n        assert document["capture"]["pending_review_item_count"] == 1\n        assert [job["source_job_id"] for job in document["jobs"]] == ["123"]\n    finally:\n        session.close()\n\n\ndef test_ai_review_export_advances_to_next_pending_capture(tmp_path) -> None:\n    session, first_capture, first_posting, raw_text = _seed_ai_review_capture(tmp_path)\n    try:\n        now = first_capture.started_at + timedelta(minutes=1)\n        source = SourceDocument(id="source-newer", source_type="linkedin", source_url="https://www.linkedin.com/jobs/view/newer/", raw_text=raw_text.replace("123", "newer"), content_hash="b" * 64, captured_at=now)\n        second_posting = Posting(id="posting-newer", source_document_id=source.id, canonical_url=source.source_url, identity_key="linkedin:newer", title="Support Engineer Newer", company="Example Systems", location="Remote", description=source.raw_text, identity_status="verified", created_at=now)\n        second_capture = CaptureRun(id="capture-newer", source="linkedin", mode="supervised_live", status="completed", search_url="https://www.linkedin.com/jobs/search/", warnings_json="[]", requested_item_limit=1, observed_item_count=1, stop_reason="submitted_batch_completed", started_at=now, completed_at=now)\n        session.add_all([source, second_capture]); session.flush(); session.add(second_posting); session.flush()\n        session.add(CaptureItem(id="item-newer", capture_run_id=second_capture.id, source_job_id="newer", source_url=source.source_url, title=second_posting.title, company=second_posting.company, location=second_posting.location, detail_status="verified", verification_reasons_json="[]", source_document_id=source.id, posting_id=second_posting.id))\n        session.commit()\n        assert json.loads(build_ai_review_json(session))["capture_run_id"] == first_capture.id\n        session.add(AIReview(id="ai-reviewed-first", capture_run_id=first_capture.id, posting_id=first_posting.id, source_job_id="123", review_source="chatgpt_source_first", review_version="test", contract_version="1.0", decision="pursue", priority_score=80, geography_status="eligible", clearance_status="clear", language_status="clear", technical_fit=80, duplicate_of_posting_id=None, summary="", reasons_json="[]", reviewed_at=first_capture.started_at, imported_at=first_capture.started_at))\n        session.commit()\n        document = json.loads(build_ai_review_json(session))\n        assert document["capture_run_id"] == second_capture.id\n        assert [job["source_job_id"] for job in document["jobs"]] == ["newer"]\n    finally:\n        session.close()\n'''
          t.write_text(q)
          PY
      - name: Focused tests
        run: |
          cd backend
          python -m pip install -e . pytest >/dev/null
          python -m pytest -q tests/test_ai_review_pack.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/jolt/ai_review_pack.py backend/tests/test_ai_review_pack.py
          git commit -m "Harden pending AI review capture selection"
          git push origin HEAD:feature/reasoning-queue-hardening-20260902
