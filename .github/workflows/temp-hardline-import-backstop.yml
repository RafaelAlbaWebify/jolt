name: Temporary hardline import backstop
on:
  push:
    branches: [fix/hardline-gate-priority-20260902]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/hardline-gate-priority-20260902
      - name: Enforce deterministic source blocker on import
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('backend/src/jolt/ai_review_import.py')
          s = p.read_text(encoding='utf-8')
          old = '''    Posting,\n    ReviewDecision,\n    utc_now,\n)\nfrom jolt.errors import JoltNotFoundError\n'''
          new = '''    Posting,\n    ReviewDecision,\n    SourceDocument,\n    utc_now,\n)\nfrom jolt.errors import JoltNotFoundError\nfrom jolt.hardline_evidence import analyze_location_evidence\n'''
          if old not in s:
              raise SystemExit('import anchor missing')
          s = s.replace(old, new, 1)

          old = '''        if session.get(Posting, job.posting_id) is None:\n            raise ValueError(f"AI review references unknown posting: {job.posting_id}")\n\n        if job.duplicate_of_posting_id is not None:\n'''
          new = '''        posting = session.get(Posting, job.posting_id)\n        if posting is None:\n            raise ValueError(f"AI review references unknown posting: {job.posting_id}")\n\n        if request.contract_version == "1.1":\n            source_document = session.get(SourceDocument, posting.source_document_id)\n            source_text = (\n                source_document.raw_text\n                if source_document is not None\n                else posting.description\n            )\n            deterministic_location = analyze_location_evidence(\n                location=posting.location,\n                source_text=source_text,\n            )\n            if deterministic_location.hardline_reject and (\n                job.hardline_status != "REJECT"\n                or job.location_eligibility != "ineligible"\n                or job.final_decision != "reject"\n                or job.fit_analysis_allowed\n                or job.technical_fit_percent is not None\n            ):\n                evidence = "; ".join(deterministic_location.negative_evidence)\n                raise ValueError(\n                    "AI review conflicts with deterministic source evidence for "\n                    f"{job.posting_id}: {evidence}"\n                )\n\n        if job.duplicate_of_posting_id is not None:\n'''
          if old not in s:
              raise SystemExit('posting validation anchor missing')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate hardline backstop
        run: |
          python -m pip install ruff pytest pytest-cov >/dev/null
          ruff check --fix backend/src/jolt/ai_review_import.py backend/src/jolt/hardline_evidence.py backend/tests/test_hardline_ai_review_gate.py
          ruff format backend/src/jolt/ai_review_import.py backend/src/jolt/hardline_evidence.py backend/tests/test_hardline_ai_review_gate.py
          ruff check backend/src/jolt/ai_review_import.py backend/src/jolt/hardline_evidence.py backend/tests/test_hardline_ai_review_gate.py
          cd backend
          python -m pip install -e . >/dev/null
          python -m pytest -q tests/test_hardline_ai_review_gate.py tests/test_ai_review_import.py tests/test_ai_review_pack.py
      - name: Commit import backstop only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/jolt/ai_review_import.py backend/src/jolt/hardline_evidence.py backend/tests/test_hardline_ai_review_gate.py
          git commit -m "Reject AI passes that violate source hardlines"
          git push origin HEAD:fix/hardline-gate-priority-20260902
