name: Temporary Phase 1 finalize
on:
  push:
    branches: [feature/reasoning-queue-hardening-20260902]
permissions:
  contents: write
jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/reasoning-queue-hardening-20260902
      - name: Restrict reasoning export to completed evidence batches
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/src/jolt/ai_review_pack.py')
          text = path.read_text(encoding='utf-8')
          old = 'select(CaptureRun).where(CaptureRun.status != "archived").order_by(CaptureRun.started_at.asc(), CaptureRun.id.asc())'
          new = '''select(CaptureRun)\n            .where(CaptureRun.status.in_(("completed", "completed_with_warnings")))\n            .order_by(CaptureRun.started_at.asc(), CaptureRun.id.asc())'''
          if old not in text:
              raise SystemExit('capture status selector anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Format and focused regression tests
        run: |
          python -m pip install ruff pytest pytest-cov >/dev/null
          ruff format backend/src/jolt/ai_review_pack.py backend/src/jolt/workflow.py backend/tests/test_ai_review_pack.py backend/tests/test_manual_reasoning_queue.py
          ruff check backend/src/jolt/ai_review_pack.py backend/src/jolt/workflow.py backend/tests/test_ai_review_pack.py backend/tests/test_manual_reasoning_queue.py
          cd backend
          python -m pip install -e . >/dev/null
          python -m pytest -q tests/test_ai_review_pack.py tests/test_manual_reasoning_queue.py
      - name: Commit production/test changes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/jolt/ai_review_pack.py backend/src/jolt/workflow.py backend/tests/test_ai_review_pack.py backend/tests/test_manual_reasoning_queue.py
          git commit -m "Finalize reasoning queue compatibility hardening"
          git push origin HEAD:feature/reasoning-queue-hardening-20260902
