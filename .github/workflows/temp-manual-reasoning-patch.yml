name: Temporary manual reasoning patch
on:
  push:
    branches: [feature/reasoning-queue-hardening-20260902]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/reasoning-queue-hardening-20260902
      - name: Add manual reasoning provenance
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('backend/src/jolt/workflow.py'); s=p.read_text()
          old='''    AIReview,\n    Application,\n    ApplicationEvent,\n    Evaluation,\n'''
          new='''    AIReview,\n    Application,\n    ApplicationEvent,\n    CaptureItem,\n    CaptureRun,\n    Evaluation,\n'''
          if old not in s: raise SystemExit('database import anchor missing')
          s=s.replace(old,new,1)
          anchor='''def ingest_manual(session: Session, request: ManualIntakeRequest) -> IntakeResponse:\n'''
          helper='''def _stage_manual_reasoning_batch(\n    session: Session,\n    request: ManualIntakeRequest,\n    source: SourceDocument,\n    posting: Posting,\n) -> None:\n    if request.source_type != "manual":\n        return\n\n    captured_at = source.captured_at\n    run = CaptureRun(\n        id=str(uuid4()),\n        source="manual",\n        mode="manual_intake",\n        status="completed",\n        search_url=request.source_url,\n        warnings_json="[]",\n        requested_item_limit=1,\n        observed_item_count=1,\n        stop_reason="manual_intake_completed",\n        started_at=captured_at,\n        completed_at=captured_at,\n    )\n    session.add(run)\n    session.flush()\n    session.add(\n        CaptureItem(\n            id=str(uuid4()),\n            capture_run_id=run.id,\n            source_job_id=f"manual:{posting.id}",\n            source_url=request.source_url,\n            title=posting.title,\n            company=posting.company,\n            location=posting.location,\n            detail_status="verified",\n            verification_reasons_json=json.dumps(\n                ["User-provided manual evidence accepted for AI review."]\n            ),\n            source_document_id=source.id,\n            posting_id=posting.id,\n        )\n    )\n\n\n'''
          if anchor not in s: raise SystemExit('ingest_manual anchor missing')
          s=s.replace(anchor,helper+anchor,1)
          old='''    session.add(evaluation)\n    try:\n        session.commit()\n'''
          new='''    session.add(evaluation)\n    _stage_manual_reasoning_batch(session, request, source, posting)\n    try:\n        session.commit()\n'''
          if old not in s: raise SystemExit('manual commit anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          t=Path('backend/tests/test_manual_reasoning_queue.py')
          t.write_text('''from __future__ import annotations\n\nimport json\n\nfrom fastapi.testclient import TestClient\nfrom sqlalchemy import select\n\nfrom jolt.ai_review_pack import build_ai_review_json\nfrom jolt.database import CaptureItem, CaptureRun, create_session_factory\nfrom jolt.main import create_app\n\n\ndef test_manual_intake_enters_existing_ai_review_contract(tmp_path) -> None:\n    database_url = f"sqlite:///{(tmp_path / 'jolt.db').as_posix()}"\n    client = TestClient(create_app(database_url))\n    response = client.post(\n        "/api/intake/manual",\n        json={\n            "source_url": "https://example.com/jobs/42",\n            "raw_text": (\n                "Application Support Engineer\\n"\n                "Example Systems\\n"\n                "Location: Remote\\n"\n                "Troubleshoot SQL, logs and APIs."\n            ),\n        },\n    )\n    assert response.status_code == 200\n    intake = response.json()\n\n    factory = create_session_factory(database_url)\n    with factory() as session:\n        run = session.scalar(select(CaptureRun).where(CaptureRun.source == "manual"))\n        assert run is not None\n        assert run.mode == "manual_intake"\n        assert run.status == "completed"\n        item = session.scalar(select(CaptureItem).where(CaptureItem.capture_run_id == run.id))\n        assert item is not None\n        assert item.detail_status == "verified"\n        assert item.posting_id == intake["posting_id"]\n        assert item.source_document_id == intake["source_document_id"]\n\n        review_input = json.loads(build_ai_review_json(session))\n        assert review_input["capture_run_id"] == run.id\n        assert review_input["capture"]["source"] == "manual"\n        assert review_input["capture"]["mode"] == "manual_intake"\n        assert review_input["counts"]["capture_items"] == 1\n        assert review_input["counts"]["verified_items"] == 1\n        assert review_input["jobs"][0]["posting_id"] == intake["posting_id"]\n        assert review_input["jobs"][0]["source_job_id"].startswith("manual:")\n\n\ndef test_duplicate_manual_intake_does_not_create_duplicate_reasoning_batch(tmp_path) -> None:\n    database_url = f"sqlite:///{(tmp_path / 'jolt.db').as_posix()}"\n    client = TestClient(create_app(database_url))\n    payload = {\n        "source_url": "https://example.com/jobs/duplicate",\n        "raw_text": "Support Engineer\\nExample Systems\\nLocation: Remote\\nSupport APIs.",\n    }\n    first = client.post("/api/intake/manual", json=payload)\n    second = client.post("/api/intake/manual", json=payload)\n    assert first.status_code == 200\n    assert second.status_code == 200\n    assert second.json()["identity_status"] == "confirmed_duplicate"\n\n    factory = create_session_factory(database_url)\n    with factory() as session:\n        runs = list(session.scalars(select(CaptureRun).where(CaptureRun.source == "manual")).all())\n        assert len(runs) == 1\n        items = list(session.scalars(select(CaptureItem).where(CaptureItem.capture_run_id == runs[0].id)).all())\n        assert len(items) == 1\n''')
          PY
          cd backend
          python -m pip install -e . pytest pytest-cov >/dev/null
          python -m pytest -q tests/test_ai_review_pack.py tests/test_manual_reasoning_queue.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/jolt/workflow.py backend/tests/test_manual_reasoning_queue.py
          git commit -m "Route manual intake through AI review evidence batches"
          git push origin HEAD:feature/reasoning-queue-hardening-20260902
