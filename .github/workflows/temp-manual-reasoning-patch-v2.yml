name: Temporary manual reasoning patch v2
on:
  push:
    branches: [feature/reasoning-queue-hardening-20260902]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/reasoning-queue-hardening-20260902
      - name: Apply and test manual reasoning provenance
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('backend/src/jolt/workflow.py'); s=p.read_text()
          s=s.replace('''    ApplicationEvent,\n    Evaluation,\n''','''    ApplicationEvent,\n    CaptureItem,\n    CaptureRun,\n    Evaluation,\n''',1)
          anchor='def ingest_manual(session: Session, request: ManualIntakeRequest) -> IntakeResponse:\n'
          helper='''def _stage_manual_reasoning_batch(\n    session: Session, request: ManualIntakeRequest, source: SourceDocument, posting: Posting\n) -> None:\n    if request.source_type != "manual":\n        return\n    captured_at = source.captured_at\n    run = CaptureRun(\n        id=str(uuid4()), source="manual", mode="manual_intake", status="completed",\n        search_url=request.source_url, warnings_json="[]", requested_item_limit=1,\n        observed_item_count=1, stop_reason="manual_intake_completed",\n        started_at=captured_at, completed_at=captured_at,\n    )\n    session.add(run)\n    session.flush()\n    session.add(CaptureItem(\n        id=str(uuid4()), capture_run_id=run.id, source_job_id=f"manual:{posting.id}",\n        source_url=request.source_url, title=posting.title, company=posting.company,\n        location=posting.location, detail_status="verified",\n        verification_reasons_json=json.dumps(["User-provided manual evidence accepted for AI review."]),\n        source_document_id=source.id, posting_id=posting.id,\n    ))\n\n\n'''
          if anchor not in s: raise SystemExit('manual intake anchor missing')
          s=s.replace(anchor,helper+anchor,1)
          old='''    session.add(evaluation)\n    try:\n        session.commit()\n'''
          new='''    session.add(evaluation)\n    _stage_manual_reasoning_batch(session, request, source, posting)\n    try:\n        session.commit()\n'''
          if old not in s: raise SystemExit('manual commit anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          Path('backend/tests/test_manual_reasoning_queue.py').write_text('''from __future__ import annotations\n\nimport json\n\nfrom sqlalchemy import select\n\nfrom jolt.ai_review_pack import build_ai_review_json\nfrom jolt.database import CaptureItem, CaptureRun, create_session_factory\nfrom jolt.schemas import ManualIntakeRequest\nfrom jolt.workflow import ingest_manual\n\n\ndef test_manual_intake_enters_existing_ai_review_contract(tmp_path) -> None:\n    database_url=f"sqlite:///{(tmp_path / 'jolt.db').as_posix()}"\n    factory=create_session_factory(database_url)\n    with factory() as session:\n        intake=ingest_manual(session, ManualIntakeRequest(source_url="https://example.com/jobs/42", raw_text="Application Support Engineer\\nExample Systems\\nLocation: Remote\\nTroubleshoot SQL, logs and APIs."))\n        run=session.scalar(select(CaptureRun).where(CaptureRun.source == "manual"))\n        assert run is not None\n        assert run.mode == "manual_intake"\n        item=session.scalar(select(CaptureItem).where(CaptureItem.capture_run_id == run.id))\n        assert item is not None\n        assert item.detail_status == "verified"\n        assert item.posting_id == intake.posting_id\n        review_input=json.loads(build_ai_review_json(session))\n        assert review_input["capture_run_id"] == run.id\n        assert review_input["capture"]["source"] == "manual"\n        assert review_input["capture"]["mode"] == "manual_intake"\n        assert review_input["counts"]["capture_items"] == 1\n        assert review_input["jobs"][0]["posting_id"] == intake.posting_id\n        assert review_input["jobs"][0]["source_job_id"].startswith("manual:")\n\n\ndef test_duplicate_manual_intake_does_not_create_duplicate_reasoning_batch(tmp_path) -> None:\n    database_url=f"sqlite:///{(tmp_path / 'jolt.db').as_posix()}"\n    factory=create_session_factory(database_url)\n    payload=ManualIntakeRequest(source_url="https://example.com/jobs/duplicate", raw_text="Support Engineer\\nExample Systems\\nLocation: Remote\\nSupport APIs.")\n    with factory() as session:\n        first=ingest_manual(session,payload)\n        second=ingest_manual(session,payload)\n        assert first.identity_status == "new"\n        assert second.identity_status == "confirmed_duplicate"\n        runs=list(session.scalars(select(CaptureRun).where(CaptureRun.source == "manual")).all())\n        assert len(runs) == 1\n        items=list(session.scalars(select(CaptureItem).where(CaptureItem.capture_run_id == runs[0].id)).all())\n        assert len(items) == 1\n''')
          PY
          cd backend
          python -m pip install -e . pytest pytest-cov >/dev/null
          python -m pytest -q tests/test_ai_review_pack.py tests/test_manual_reasoning_queue.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/jolt/workflow.py backend/tests/test_manual_reasoning_queue.py
          git commit -m "Route manual intake through AI review evidence batches"
          git push origin HEAD:feature/reasoning-queue-hardening-20260902
