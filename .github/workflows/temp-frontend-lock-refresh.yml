name: Temporary frontend lock refresh

on:
  push:
    branches:
      - feature/multisource-discovery-foundation

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/multisource-discovery-foundation
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Refresh secure test dependencies
        run: |
          npm install --save-dev --package-lock-only --ignore-scripts --no-fund vitest@5.0.3
          npm audit fix --package-lock-only --ignore-scripts --no-fund
          npm audit --audit-level=high
      - name: Commit refreshed manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh frontend test dependencies"
          git push origin HEAD:feature/multisource-discovery-foundation
